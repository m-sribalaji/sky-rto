name: Build SkyRTO Tracker Binaries

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'scripts/**'
      - 'shared/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  # ── macOS arm64 (M1/M2/M3) ──────────────────────────────────────────────
  build-mac-arm64:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          pip install pyinstaller pyobjc-framework-Cocoa certifi

      - name: Build and install native_signer (device-bound Keychain signing)
        run: |
          # macos-14 runners ship Rust/Cargo preinstalled — no extra
          # third-party action needed for the toolchain itself.
          cargo --version
          pip install maturin
          cd client/native_signer
          maturin build --release --interpreter python3.11
          pip install target/wheels/*.whl
          cd ../..
          python3 -c "import native_signer; print('native_signer import OK:', native_signer.__file__)"
          pip install cryptography

      - name: Verify native_signer actually works (not just compiles)
        run: |
          # Real functional test, not just "did it import" — generate a
          # key, sign something, verify with the exact method the server
          # uses (deps.py::_verify_ecdsa_signature), confirm a tampered
          # message is rejected. Mirrors manual verification done on real
          # hardware during development (see client/native_signer/README.md).
          # Uses a CI-only key tag so it never collides with a real
          # device's key, and cleans up after itself either way.
          python3 -c "
          import native_signer, base64, sys

          try:
              pub_b64 = native_signer.generate_device_keypair()
              msg = b'ci-verification-2026-09'
              sig_b64 = native_signer.sign_message(base64.b64encode(msg).decode())

              from cryptography.hazmat.primitives.asymmetric import ec
              from cryptography.hazmat.primitives import hashes
              from cryptography.exceptions import InvalidSignature

              pub = base64.b64decode(pub_b64)
              sig = base64.b64decode(sig_b64)
              public_key = ec.EllipticCurvePublicKey.from_encoded_point(ec.SECP256R1(), pub)
              public_key.verify(sig, msg, ec.ECDSA(hashes.SHA256()))
              print('OK: genuine signature verified')

              try:
                  public_key.verify(sig, b'tampered', ec.ECDSA(hashes.SHA256()))
                  print('FAIL: tampered message incorrectly verified')
                  sys.exit(1)
              except InvalidSignature:
                  print('OK: tampered message correctly rejected')
          finally:
              import subprocess
              subprocess.run(['security', 'delete-generic-password', '-s', 'com.sky.rto-tracker', '-a', 'com.sky.rto-tracker.device-key'], capture_output=True)
          "

      - name: Inject version and secrets into rto_client/config.py
        env:
          BUILD_NUM: ${{ github.run_number }}
          BAKED_SERVER_URL: ${{ secrets.BAKED_SERVER_URL }}
          BAKED_TEAMS_WEBHOOK: ${{ secrets.BAKED_TEAMS_WEBHOOK }}
        run: |
          python3 inject_version.py "0.0.${BUILD_NUM}" client/rto_client/config.py
          grep "_BAKED_VERSION\|_BAKED_SERVER_URL" client/rto_client/config.py

      - name: Build rto-mac-arm64
        run: |
          pyinstaller \
            --onefile --noconfirm --clean --noupx \
            --distpath dist \
            --add-data "client/checkin_core.py:." \
            --add-data "client/rto_client:rto_client" \
            --add-data "shared/notifier.py:." \
            --hidden-import=checkin_core \
            --hidden-import=rto_client \
            --hidden-import=rto_client.config \
            --hidden-import=rto_client.network \
            --hidden-import=rto_client.classify \
            --hidden-import=rto_client.queue \
            --hidden-import=rto_client.api \
            --hidden-import=rto_client.lock \
            --hidden-import=rto_client.update \
            --hidden-import=rto_client.missed \
            --hidden-import=rto_client.checkin \
            --hidden-import=notifier \
            --hidden-import=platform \
            --hidden-import=ipaddress \
            --hidden-import=hmac \
            --hidden-import=hashlib \
            --hidden-import=secrets \
            --hidden-import=urllib.request \
            --hidden-import=urllib.error \
            --hidden-import=fcntl \
            --hidden-import=json \
            --hidden-import=threading \
            --hidden-import=socket \
            --hidden-import=argparse \
            --hidden-import=logging \
            --hidden-import=webbrowser \
            --hidden-import=random \
            --hidden-import=datetime \
            --hidden-import=pathlib \
            --hidden-import=ssl \
            --hidden-import=certifi \
            --hidden-import=zlib \
            --collect-all=certifi \
            --hidden-import=AppKit \
            --hidden-import=Foundation \
            --hidden-import=objc \
            --hidden-import=native_signer \
            --collect-all=native_signer \
            --name rto-mac-arm64 \
            scripts/rto_agent_mac.py

      - name: Ad-hoc codesign the binary
        run: |
          # Apple Silicon macOS refuses to even start an unsigned Mach-O
          # binary — the kernel kills it before any code runs, no error
          # message, nothing. That bit twice: once on a manual curl
          # download, once via the client's own self-updater silently
          # downloading and swapping in this same unsigned binary. Signing
          # it once here means every future download (manual or
          # auto-update) inherits a valid signature automatically, since
          # they're all just fetching these exact same release bytes.
          #
          # `codesign --verify` alone isn't sufficient proof the signature
          # is actually valid at launch time — confirmed live (2026-09):
          # two separate builds passed `codesign --verify` here but still
          # got SIGKILL'd on real hardware with "Taskgated Invalid
          # Signature" (a stricter check than --verify performs). So this
          # step now actually launches the signed binary (--help, which
          # argparse handles immediately with no side effects) as the
          # real proof it'll run, and retries the sign+launch cycle if it
          # doesn't — catching this flake in CI instead of shipping a
          # binary that gets silently killed on every user's machine.
          for attempt in 1 2 3; do
            codesign --force --deep --sign - dist/rto-mac-arm64
            codesign --verify --verbose dist/rto-mac-arm64
            if dist/rto-mac-arm64 --help > /dev/null 2>&1; then
              echo "Signed binary launches successfully (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Signed binary failed to launch on attempt $attempt (SIGKILL/Taskgated flake) — retrying."
          done
          echo "::error::Signed binary still fails to launch after 3 attempts."
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rto-mac-arm64
          path: dist/rto-mac-arm64

  # ── Windows x64 ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          pip install pyinstaller pywin32 certifi

      - name: Inject version and secrets into rto_client/config.py
        shell: bash
        env:
          BUILD_NUM: ${{ github.run_number }}
          BAKED_SERVER_URL: ${{ secrets.BAKED_SERVER_URL }}
          BAKED_TEAMS_WEBHOOK: ${{ secrets.BAKED_TEAMS_WEBHOOK }}
        run: |
          python3 inject_version.py "0.0.${BUILD_NUM}" client/rto_client/config.py
          grep "_BAKED_VERSION\|_BAKED_SERVER_URL" client/rto_client/config.py

      - name: Build rto-win.exe
        shell: bash
        run: |
          pyinstaller \
            --onefile --noconfirm --clean --noupx \
            --distpath dist \
            --add-data "client/checkin_core.py;." \
            --add-data "client/rto_client;rto_client" \
            --add-data "shared/notifier.py;." \
            --hidden-import=checkin_core \
            --hidden-import=rto_client \
            --hidden-import=rto_client.config \
            --hidden-import=rto_client.network \
            --hidden-import=rto_client.classify \
            --hidden-import=rto_client.queue \
            --hidden-import=rto_client.api \
            --hidden-import=rto_client.lock \
            --hidden-import=rto_client.update \
            --hidden-import=rto_client.missed \
            --hidden-import=rto_client.checkin \
            --hidden-import=notifier \
            --hidden-import=platform \
            --hidden-import=ipaddress \
            --hidden-import=hmac \
            --hidden-import=hashlib \
            --hidden-import=secrets \
            --hidden-import=urllib.request \
            --hidden-import=urllib.error \
            --hidden-import=json \
            --hidden-import=threading \
            --hidden-import=socket \
            --hidden-import=argparse \
            --hidden-import=logging \
            --hidden-import=webbrowser \
            --hidden-import=random \
            --hidden-import=datetime \
            --hidden-import=pathlib \
            --hidden-import=ssl \
            --hidden-import=certifi \
            --hidden-import=zlib \
            --collect-all=certifi \
            --hidden-import=winreg \
            --hidden-import=ctypes \
            --hidden-import=win32api \
            --hidden-import=win32con \
            --hidden-import=win32gui \
            --hidden-import=win32ts \
            --name rto-win \
            scripts/rto_agent_win.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rto-win
          path: dist/rto-win.exe

  # ── Bundle into a GitHub Release ────────────────────────────────────────
  release:
    needs: [build-mac-arm64, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "sky-rto build-${{ github.run_number }}"
          body: |
            Auto-built from commit ${{ github.sha }}
            Version: 0.0.${{ github.run_number }}

            **Download the right file for your machine:**
            - `rto-mac-arm64` — Mac with Apple Silicon (M1 / M2 / M3)
            - `rto-win.exe`   — Windows (all x64)

            **macOS install:**
            1. Download `rto-mac-arm64`
            2. Open Terminal in the download folder
            3. Run: `xattr -d com.apple.quarantine rto-mac-arm64 && chmod +x rto-mac-arm64 && ./rto-mac-arm64`
            4. Browser opens for registration — done

            **Windows install:**
            1. Download `rto-win.exe`
            2. Double-click — SmartScreen: click More info then Run anyway
            3. Browser opens for registration — done

            **Already installed? No action needed.**
            The agent updates itself automatically on next startup.
          files: |
            dist/rto-mac-arm64/rto-mac-arm64
            dist/rto-win/rto-win.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}