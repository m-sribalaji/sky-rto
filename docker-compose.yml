version: "3.9"

services:
  rto-tracker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sky-rto-tracker
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/rto.db
      - TZ=Asia/Kolkata
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8989/health')"]
      interval: 30s
      timeout: 10s
      retries: 3