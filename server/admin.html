<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RTO Admin - DB View</title>
<script>
// Set before the stylesheet loads so there's no flash of the wrong theme
// on first paint — see theme.js for the rest of the light/dark/system switcher.
(function(){var t=localStorage.getItem('_sk_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<!-- CSS and JS used to live inline here; they now live in server/static/admin.css and admin.js -->
<link rel="icon" type="image/png" href="/static/sky-logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Geist:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>

<!-- Access denied screen (shown if not admin) -->
<div id="denied" class="denied" style="display:none">
  <i data-lucide="shield-off"></i>
  <h2>Access Denied</h2>
  <p>Admin role required to view this page.</p>
</div>

<!-- Main app (hidden until auth confirmed) -->
<div id="app" style="display:none">

  <div class="topbar">
    <div class="topbar-logo">
      <div class="logo-icon"><img src="/static/sky-logo.png" alt="Sky RTO"/></div>
      <span style="font-family:var(--serif);font-size:16px;letter-spacing:-0.01em;">RTO Admin</span>
    </div>
    <div class="topbar-sep"></div>
    <span class="topbar-title">DB View</span>
    <div class="topbar-badge">
      <i data-lucide="shield-alert"></i>
      Admin only
    </div>
    <span class="topbar-emp" id="topbar-emp"></span>
    <div data-theme-toggle="inline" style="margin-left:10px"></div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-label">Tables</div>
      <div class="sidebar-section" id="table-list">
        <!-- populated by JS -->
      </div>
    </div>

    <div class="main" id="main-content">
      <div class="empty">
        <i data-lucide="table-2"></i>
        <p>Select a table to browse</p>
      </div>
    </div>
  </div>

</div>

<!-- Delete confirm modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Delete row?</h3>
    <p id="modal-msg">This action cannot be undone.</p>
    <div class="modal-row">
      <button class="modal-cancel" onclick="closeModal()" style="display:flex;align-items:center;gap:5px"><i data-lucide="x"></i> Cancel</button>
      <button class="modal-confirm" onclick="confirmDelete()" style="display:flex;align-items:center;gap:5px"><i data-lucide="trash-2"></i> Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/admin.js"></script>
<script src="/static/theme.js"></script>
</body>
</html>
