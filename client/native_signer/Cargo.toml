[package]
name = "native_signer"
version = "0.1.0"
edition = "2021"
description = "Device-bound, non-exportable ECDSA signing for the Sky RTO agent — private key lives only in the OS credential store (macOS Keychain / Windows CNG key storage), never in application memory as raw bytes."

[lib]
name = "native_signer"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
base64 = "0.22"
thiserror = "1.0"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = "0.16"
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "2.11", features = ["OSX_10_15"] }
security-framework-sys = "2.11"
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }
